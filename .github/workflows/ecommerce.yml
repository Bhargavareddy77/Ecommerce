name: CI/CD pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce:${TAG} .

      - name: Push the image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce:${TAG}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Pull the Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/ecommerce:${TAG}

      - name: Stop old container
        run: docker stop ecommerce || true && docker rm ecommerce || true

      - name: Run Container
        run: docker run -d -p 80:80 --name ecommerce ${{ secrets.DOCKER_USERNAME }}/ecommerce:${TAG}
