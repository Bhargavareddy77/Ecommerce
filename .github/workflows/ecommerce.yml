name: CI/CD pipeline

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone code
        uses: actions/checkout@v4

      - name: Show files (debug)
        run: ls -R

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce ./Ecommerce

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull the Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/ecommerce

      - name: Stop old container
        run: docker stop ecommerce || true && docker rm ecommerce || true

      - name: Run Container
        run: docker run -d -p 80:80 --name ecommerce ${{ secrets.DOCKER_USERNAME }}/ecommerce
